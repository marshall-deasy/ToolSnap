{% extends "base.html" %}

{% block title %}LogViewer - {{ log_name }}{% endblock %}

{% block content %}
<div class="log-viewer">
    <!-- Controls Panel -->
    <div class="controls-panel">
        <div class="controls-left">
            <a href="/" class="btn btn-secondary">← Back</a>
            <span class="log-title">{{ log_name }}</span>
            <span class="log-size-badge">{{ "%.1f" | format(size_mb) }} MB</span>
        </div>
        <div class="controls-right">
            <button id="searchBtn" class="btn btn-blue">🔍 Search</button>
            <button id="favoriteBtn" class="btn btn-{{ 'orange' if is_favorite else 'secondary' }}" 
                    data-path="{{ log_path }}" 
                    data-favorite="{{ 'true' if is_favorite else 'false' }}">
                {{ '⭐ Unfavorite' if is_favorite else '☆ Favorite' }}
            </button>
            <button id="downloadBtn" class="btn btn-secondary" onclick="window.location.href='{{ url_for('api_download', log_path=log_path) }}'">
                ⬇ Download
            </button>
            <button id="refreshBtn" class="btn btn-green">🔄 Refresh</button>
            <label class="auto-refresh-toggle">
                <input type="checkbox" id="autoRefreshCheck" checked>
                <span>Auto</span>
            </label>
        </div>
    </div>

    <!-- Search Panel (hidden by default) -->
    <div id="searchPanel" class="search-panel" style="display: none;">
        <div class="search-form">
            <input type="text" id="searchInput" placeholder="Search query..." class="search-input">
            <label class="search-option">
                <input type="checkbox" id="regexCheck">
                <span>Regex</span>
            </label>
            <label class="search-option">
                <input type="checkbox" id="caseCheck">
                <span>Case sensitive</span>
            </label>
            <button id="executeSearchBtn" class="btn btn-blue">Search</button>
            <button id="clearSearchBtn" class="btn btn-secondary">Clear</button>
        </div>
        <div id="searchResults" class="search-results"></div>
    </div>

    <!-- Filter Panel -->
    <div class="filter-panel">
        <label>
            Filter:
            <select id="levelFilter" class="filter-select">
                <option value="">All</option>
                <option value="ERROR">ERROR</option>
                <option value="WARNING">WARNING</option>
                <option value="INFO">INFO</option>
                <option value="DEBUG">DEBUG</option>
            </select>
        </label>
        <label>
            Lines:
            <select id="tailLines" class="filter-select">
                <option value="50">50</option>
                <option value="100" selected>100</option>
                <option value="200">200</option>
                <option value="500">500</option>
                <option value="1000">1000</option>
            </select>
        </label>
        <span id="statusMessage" class="status-message"></span>
    </div>

    <!-- Log Content -->
    <div class="log-content" id="logContent">
        <div class="loading">Loading log content...</div>
    </div>
</div>

<script>
    // Pass config to JavaScript
    window.logViewerConfig = {
        logPath: {{ log_path | tojson }},
        refreshInterval: {{ refresh_interval }},
        tailLines: {{ tail_lines }}
    };
</script>
<script src="{{ url_for('static', filename='js/viewer.js') }}"></script>
{% endblock %}
