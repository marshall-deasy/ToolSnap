<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DependencyAnalyzer{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="header">
        <div class="header-left">
            <h1 class="title">
                <a href="/" style="color: inherit; text-decoration: none;">DependencyAnalyzer</a>
            </h1>
            <span class="subtitle">Clean Up Your Projects</span>
        </div>
        <div class="header-right">
            <span class="project-root">{{ project_root }}</span>
        </div>
    </div>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    {% block extra_js %}{% endblock %}
</body>
</html>
